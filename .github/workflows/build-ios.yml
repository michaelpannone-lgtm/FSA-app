name: Build iPhone app

# Builds on GitHub's macOS machines, so no Mac is needed.
# Output: an unsigned HSAReceipts.ipa (download from the run's "Artifacts" section),
# which Sideloadly on Windows signs with your Apple ID and installs on your iPhone.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (receipt parser, eligibility rules, reimbursement planner)
        working-directory: HSACore
        run: swift test

  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HSAReceipts.xcodeproj \
            -scheme HSAReceipts \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log | sort -u | head -80; exit 1; }
          grep -E "BUILD SUCCEEDED" xcodebuild.log
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HSAReceipts.app Payload/
          zip -qry HSAReceipts.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HSAReceipts-ipa
          path: HSAReceipts.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
