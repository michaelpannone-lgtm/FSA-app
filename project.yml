name: HSAReceipts
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HSACore:
    path: HSACore
targets:
  HSAReceipts:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HSACore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HSA Receipts
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Scan receipts with the camera so the app can read them.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hsareceipts   # change to something unique, e.g. com.yourname.hsareceipts
        DEVELOPMENT_TEAM: ""                                  # or pick your team in Xcode › Signing & Capabilities
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  HSAReceipts:
    build:
      targets:
        HSAReceipts: all
    test:
      targets:
        - package: HSACore/HSACoreTests
